<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fatu's 100</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B2A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fatu 100">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B2A4A; --go:#2563EB; --sky:#BFD6FF; --wash:#EDF3FE;
    --paper:#F4F7FC; --line:#DCE6F5; --muted:#5A6E88; --park:#8A9BB4;
    --gold:#B8892B; --bronze:#A9793F; --silver:#7E8E86;
    --shadow:0 1px 2px rgba(11,42,74,.05), 0 6px 20px rgba(11,42,74,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:Nunito,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top)}
  h1,h2,h3{font-family:'Varela Round',Nunito,sans-serif;font-weight:400;margin:0}
  button{font-family:Nunito,sans-serif;font-weight:800;border:0;cursor:pointer;transition:all .16s ease}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--go);outline-offset:2px}
  input,textarea,select{font-family:Nunito,sans-serif;font-weight:700;color:var(--ink);background:var(--paper);
    border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;outline:none;width:100%;font-size:16px}
  input:focus,textarea:focus{border-color:var(--go);background:#fff;box-shadow:0 0 0 4px var(--wash)}
  .app{max-width:620px;margin:0 auto;padding:18px max(22px,env(safe-area-inset-left)) 116px max(22px,env(safe-area-inset-left))}

  .topbar{position:sticky;top:0;z-index:25;background:#fff;border-bottom:1.5px solid var(--line);margin:-18px -16px 18px;
    padding-top:env(safe-area-inset-top)}
  .tinner{max-width:620px;margin:0 auto;padding:16px max(22px,env(safe-area-inset-left)) 16px max(22px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:12px}
  .branding{display:flex;align-items:center;gap:11px;min-width:0}
  .logomark{width:36px;height:36px;flex-shrink:0;border-radius:11px;background:var(--ink);color:#fff;
    font-family:'Varela Round',sans-serif;font-size:14px;display:flex;align-items:center;justify-content:center;
    letter-spacing:-.02em;position:relative;box-shadow:0 2px 8px rgba(11,42,74,.18)}
  .logomark:after{content:'';position:absolute;left:8px;right:8px;bottom:7px;height:2px;border-radius:2px;background:var(--go)}
  .greet{font-weight:800;font-size:17px;color:var(--ink);letter-spacing:-.01em}
  .greet.brand{font-family:'Varela Round',sans-serif;font-weight:400;color:var(--go);font-size:18px}
  .tdate{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}

  .cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:7px}
  .card{background:#fff;border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px;margin-bottom:12px}
  .lede{font-size:14px;font-weight:700;color:var(--muted);line-height:1.6;margin-top:8px}
  .metaline{font-size:13px;font-weight:700;color:var(--muted);margin-top:12px;line-height:1.6}
  .metaline b{color:var(--ink)}
  .phead{margin:4px 4px 16px}
  .phead h1{font-size:26px}
  .phead p{font-size:13px;font-weight:700;color:var(--muted);margin:6px 0 0;line-height:1.5}

  /* dashboard stat tiles */
  .quad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
  .stat b{display:block;font-family:'Varela Round',sans-serif;font-size:27px;line-height:1}
  .stat b.sm{font-size:19px}
  .stat span{display:block;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:6px}
  .stat.accent b{color:var(--go)}

  /* skill card */
  .skill{background:#fff;border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px;margin-bottom:12px;cursor:pointer;transition:border-color .16s}
  .skill:hover{border-color:var(--go)}
  .skill .stop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .skill h3{font-size:19px}
  .skill .scat{font-size:11px;font-weight:800;color:var(--muted);margin-top:3px;letter-spacing:.02em}
  .skill .stage{font-size:11px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--go);
    background:var(--wash);border-radius:99px;padding:5px 11px;white-space:nowrap}
  .skill .stage.done{color:#fff;background:var(--gold)}
  .repline{display:flex;align-items:baseline;gap:8px;margin:12px 0 8px}
  .repline b{font-family:'Varela Round',sans-serif;font-size:30px;line-height:1}
  .repline span{font-size:13px;font-weight:700;color:var(--muted)}
  .pbar{height:10px;background:var(--wash);border-radius:99px;overflow:hidden;position:relative}
  .pbar i{display:block;height:100%;background:var(--go);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .pbar i.gold{background:var(--gold)}
  /* stage ticks on the bar */
  .pbar u{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.7)}

  .cathead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:20px 4px 10px}
  .cathead:first-of-type{margin-top:4px}
  .catname{font-family:'Varela Round',sans-serif;font-size:16px;color:var(--ink)}
  .catmeta{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.02em}
  .cattiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .ctile{background:#fff;border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
    padding:18px 16px;text-align:left;display:flex;flex-direction:column;gap:0;min-height:132px;position:relative;overflow:hidden}
  .ctile:hover{border-color:var(--go)}
  .ctile .cicon{width:26px;height:26px;stroke:var(--go);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-bottom:12px}
  .ctile .cname{font-family:'Varela Round',sans-serif;font-size:16px;color:var(--ink);line-height:1.15}
  .ctile .cmeta{font-size:11px;font-weight:800;color:var(--muted);margin-top:5px;letter-spacing:.02em}
  .ctile .cbar{height:6px;background:var(--wash);border-radius:99px;overflow:hidden;margin-top:auto}
  .ctile .cbar i{display:block;height:100%;background:var(--go);border-radius:99px;transition:width .5s ease}
  .backbtn{background:none;border:0;color:var(--muted);font-size:13px;font-weight:800;padding:4px 0;letter-spacing:.02em}
  .backbtn:hover{color:var(--go)}
  .chaingrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .chaincell{aspect-ratio:1;border-radius:7px;background:var(--wash);border:1.5px solid var(--line)}
  .chaincell.hit{background:var(--go);border-color:var(--go)}
  .chaincell.today{box-shadow:0 0 0 2px var(--ink)}
  .chaincell.today.hit{box-shadow:0 0 0 2px var(--gold)}
  .chainmeta{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted);margin-top:12px}
  .chainmeta b{color:var(--ink);font-family:'Varela Round',sans-serif;font-size:15px}
  .chainmeta em{font-style:normal;color:var(--gold)}
  .mission{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--paper)}
  .mission:last-child{border-bottom:0}
  .mission .mtick{width:24px;height:24px;flex-shrink:0;border-radius:8px;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:900;transition:all .16s}
  .mission.done .mtick{background:var(--go);border-color:var(--go)}
  .mission .mname{flex:1;font-size:15px;font-weight:800;color:var(--ink)}
  .mission.done .mname{color:var(--muted)}
  .mission .mpts{font-size:12px;font-weight:900;letter-spacing:.04em;color:var(--muted)}
  .mission.done .mpts{color:var(--go)}
  .parked{opacity:.6}
  .parktag{font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--park);
    background:var(--paper);border:1.5px solid var(--line);border-radius:99px;padding:4px 9px}

  .bigbtn{width:100%;background:var(--ink);color:#fff;border-radius:14px;padding:16px;font-size:16px;margin-top:4px}
  .bigbtn:hover{background:var(--go)}
  .bigbtn.go{background:var(--go)}
  .ghost{background:#fff;border:1.5px solid var(--line);color:var(--muted);border-radius:12px;padding:11px 16px;
    font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  .ghost:hover{border-color:var(--go);color:var(--ink)}
  .ghostrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

  /* skill detail: big counter */
  .counter{text-align:center;padding:10px 0 4px}
  .counter .n{font-family:'Varela Round',sans-serif;font-size:88px;line-height:.9;color:var(--go)}
  .counter .n small{font-size:30px;color:var(--muted)}
  .counter .stagelabel{font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-top:8px}
  .counter .crafttitle{font-family:'Varela Round',sans-serif;font-size:15px;color:var(--go);margin-top:6px}

  /* stage ladder */
  .ladder{display:flex;flex-direction:column;gap:7px;margin-top:6px}
  .lrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:13px;background:var(--paper);border:1.5px solid var(--line)}
  .lrow.on{background:var(--wash);border-color:var(--go)}
  .lrow.done{background:#fff;border-color:var(--gold)}
  .lrow .lnum{width:34px;flex-shrink:0;font-family:'Varela Round',sans-serif;font-size:13px;color:var(--muted)}
  .lrow.on .lnum,.lrow.done .lnum{color:var(--ink)}
  .lrow .lname{flex:1;font-size:15px;font-weight:800}
  .lrow .lmark{font-size:14px;font-weight:900;color:var(--line)}
  .lrow.done .lmark{color:var(--gold)}
  .lrow.on .lmark{color:var(--go)}

  /* rating dots */
  .rate{display:flex;gap:10px;justify-content:center;margin:14px 0}
  .rdot{width:44px;height:44px;border-radius:99px;border:2px solid var(--line);background:#fff;color:var(--muted);
    font-family:'Varela Round',sans-serif;font-size:18px;display:flex;align-items:center;justify-content:center}
  .rdot.on{background:var(--go);border-color:var(--go);color:#fff}
  .rdot:hover{border-color:var(--go)}

  /* rep history */
  .rep{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--paper)}
  .rep:last-child{border-bottom:0}
  .rep .ri{width:40px;flex-shrink:0;font-family:'Varela Round',sans-serif;font-size:16px;color:var(--go)}
  .rep .rc{flex:1;min-width:0}
  .rep .rc .rnote{font-size:14px;font-weight:700}
  .rep .rc .rmeta{font-size:12px;font-weight:700;color:var(--muted);margin-top:2px}
  .rep .rstars{font-size:12px;color:var(--gold);white-space:nowrap;font-weight:900}

  /* rating trend */
  .trend{height:80px;margin-top:10px;position:relative}

  /* badges */
  .badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
  .badge{border:1.5px solid var(--line);border-radius:16px;padding:14px;background:var(--paper);position:relative}
  .badge.got{background:#fff}
  .badge.got.t1{border-color:var(--bronze)} .badge.got.t2{border-color:var(--silver)} .badge.got.t3{border-color:var(--gold)}
  .badge b{display:block;font-size:13px;font-weight:800;color:var(--muted);padding-right:18px}
  .badge.got b{color:var(--ink)}
  .badge .sub{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-top:4px;line-height:1.4}
  .badge .mark{position:absolute;top:12px;right:12px;font-size:14px;color:var(--line);font-weight:900}
  .badge.got.t1 .mark{color:var(--bronze)} .badge.got.t2 .mark{color:var(--silver)} .badge.got.t3 .mark{color:var(--gold)}
  .badge .mini{height:5px;background:var(--wash);border-radius:99px;margin-top:9px;overflow:hidden}
  .badge .mini i{display:block;height:100%;background:var(--park);border-radius:99px}
  .badge .pts{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px;display:block}

  /* rank block */
  .yeargrid{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;align-items:end;height:96px}
  .ycol{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
  .ybar{flex:1;width:100%;background:var(--wash);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}
  .ybar i{display:block;width:100%;background:var(--go);border-radius:5px;min-height:2px;transition:height .5s ease}
  .ycol span{font-size:9px;font-weight:800;color:var(--muted)}
  .badge.secret{background:repeating-linear-gradient(45deg,var(--paper),var(--paper) 8px,#EEF3FB 8px,#EEF3FB 16px);border-style:dashed}
  .badge.secret b{color:var(--park)} .badge.secret .mark{color:var(--park)}
  .rank{display:flex;align-items:center;gap:16px}
  .rank .lv{width:74px;height:74px;flex-shrink:0;border-radius:22px;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .rank .lv b{font-family:'Varela Round',sans-serif;font-size:29px;line-height:1}
  .rank .lv span{font-size:8px;letter-spacing:.14em;text-transform:uppercase;margin-top:3px;opacity:.75}
  .rank .who{flex:1}
  .rank .who h2{font-size:22px}
  .xpbar{height:9px;background:var(--wash);border-radius:99px;overflow:hidden;margin-top:10px}
  .xpbar i{display:block;height:100%;background:var(--go);border-radius:99px;transition:width .6s ease}
  .pcts{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--muted);margin-top:7px}

  /* modal / sheet */
  .scrim{position:fixed;inset:0;z-index:50;background:rgba(11,30,55,.4);backdrop-filter:blur(3px)}
  .scrim[hidden]{display:none}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:620px;margin:0 auto;background:var(--paper);
    border-radius:26px 26px 0 0;max-height:90vh;overflow-y:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 40px rgba(11,42,74,.22);animation:rise .28s cubic-bezier(.2,.85,.25,1)}
  .sheet[hidden]{display:none}
  @keyframes rise{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
  .grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:8px auto 16px}
  .sheet h2{font-size:23px;margin-bottom:4px}
  textarea{resize:none;min-height:64px}

  /* toast */
  .toast{position:fixed;left:16px;right:16px;bottom:96px;z-index:60;max-width:588px;margin:0 auto;background:var(--ink);color:#fff;
    border-radius:18px;padding:16px 18px;box-shadow:0 12px 34px rgba(11,42,74,.3);animation:pop .35s cubic-bezier(.2,.9,.25,1)}
  .toast[hidden]{display:none}
  .confetti{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
  .confetti i{position:absolute;top:32%;display:block;opacity:0;animation-name:fall;animation-timing-function:cubic-bezier(.25,.6,.4,1);animation-fill-mode:forwards}
  @keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),64vh) rotate(var(--rot))}}
  .toast b{display:block;font-family:'Varela Round',sans-serif;font-size:17px}
  .toast span{display:block;font-size:12px;font-weight:700;opacity:.85;margin-top:3px}
  @keyframes pop{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}

  /* bottom nav */
  .bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);
    border-top:1.5px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
  .bottominner{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
  .nb{background:none;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;color:var(--park);
    font-size:11px;letter-spacing:.03em;font-weight:800;border-radius:14px}
  .nb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .nb.on{color:var(--ink)} .nb.on svg{stroke:var(--go)}
  .page[hidden]{display:none}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="topbar"><div class="tinner">
  <div class="branding">
    <div class="logomark">100</div>
    <div class="greet" id="greetLine"></div>
  </div>
  <div class="tdate" id="topRight"></div>
</div></header>

<div class="app">
  <section class="page" id="p-home"></section>
  <section class="page" id="p-skills" hidden></section>
  <section class="page" id="p-prog" hidden></section>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<nav class="bottom"><div class="bottominner">
  <button class="nb on" data-go="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button class="nb" data-go="skills"><svg viewBox="0 0 24 24"><path d="M12 3l2.5 5 5.5.8-4 3.9 1 5.5L12 21l-5 2.6 1-5.5-4-3.9 5.5-.8z"/></svg>Skills</button>
  <button class="nb" data-go="prog"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H3"/></svg>Progress</button>
</div></nav>

<script>
/* ================= storage ================= */
const store={
  async get(k){ if(window.storage&&window.storage.get){try{const r=await window.storage.get(k);return r&&r.value?r.value:null;}catch(e){return null;}}
    try{return localStorage.getItem(k);}catch(e){return null;} },
  async set(k,v){ if(window.storage&&window.storage.set){try{return await window.storage.set(k,v);}catch(e){}}
    try{localStorage.setItem(k,v);}catch(e){} }
};
const KEY='fatu-100-v4';

/* ================= model ================= */
const STAGES=[
  {from:1,to:10,name:'Beginner'},
  {from:11,to:30,name:'Finding it'},
  {from:31,to:60,name:'Getting good'},
  {from:61,to:90,name:'Sharp'},
  {from:91,to:100,name:'Mastery'}
];
const GOAL=100;
function stageOf(reps){
  if(reps<=0) return {idx:-1,name:'Not started',from:0,to:0};
  for(let i=0;i<STAGES.length;i++){ if(reps>=STAGES[i].from && reps<=STAGES[i].to) return {idx:i,...STAGES[i]}; }
  return {idx:STAGES.length-1,...STAGES[STAGES.length-1]};
}

const uid=()=>'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const CATS=[
  ['visual','Visual craft','M3 16l5-5 4 4 5-6 4 5M4 20h16'],
  ['voice','Voice & presence','M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM6 11a6 6 0 0 0 12 0M12 17v4'],
  ['beauty','Beauty & style','M12 3l2.5 5 5.5.8-4 3.9 1 5.5L12 21l-5 2.7 1-5.5-4-3.9 5.5-.8z'],
  ['movement','Movement','M13 4a1.5 1.5 0 1 0 0-.01M8 21l3-6 3 2 1 4M11 15l-2-4 5-2 3 3'],
  ['space','Space','M3 21V9l9-6 9 6v12M9 21v-6h6v6'],
  ['culture','Culture','M9 18V5l12-2v13M9 13l12-2M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z'],
  ['business','Business','M3 7h18v12H3zM8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18']
];
const catName=id=>{const c=CATS.find(c=>c[0]===id);return c?c[1]:'Other';};
const catIcon=id=>{const c=CATS.find(c=>c[0]===id);return c?c[2]:'';};
function seedSkills(){
  const seed=[
    ['Photography','visual'],['Cinematography','visual'],['Sony A7III','visual'],['Lightroom editing','visual'],
    ['Public speaking','voice'],['Storytelling','voice'],['Emotional intelligence','voice'],
    ['Lip combo','beauty'],['Baby hair / edges','beauty'],['Fashion tips','beauty'],['Colour matching','beauty'],
    ['Twerk','movement'],['Zep','movement'],
    ['Interior design','space'],

const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MO=['January','February','March','April','May','June','July','August','September','October','November','December'];
const ord=d=>(d>3&&d<21)?d+'th':d+({1:'st',2:'nd',3:'rd'}[d%10]||'th');
const longToday=()=>{const d=new Date();return DN[d.getDay()]+' '+ord(d.getDate())+' '+MO[d.getMonth()];};
const shortDate=ms=>{const d=new Date(ms);return DN[d.getDay()].slice(0,3)+' '+ord(d.getDate())+' '+MO[d.getMonth()].slice(0,3);};

const repCount=s=>s.reps.length;

/* points: rep=10, crossing into a new stage=+40, finishing 100=+150 (all baked into level math) */
function skillPoints(s){
  let p=repCount(s)*10;
  const st=stageOf(repCount(s));
  p += Math.max(0,st.idx)*40;        // stages passed
  if(repCount(s)>=GOAL) p+=150;
  return p;
}
const totalPoints=()=>state.skills.reduce((a,s)=>a+skillPoints(s),0);

// ---- category aggregates ----
const catReps=id=>state.skills.filter(s=>s.cat===id).reduce((a,s)=>a+repCount(s),0);
const catSkills=id=>state.skills.filter(s=>s.cat===id);
function catLevel(id){ // a category levels every 30 reps within it
  const r=catReps(id); return {lv:Math.floor(r/30)+1, into:r%30, need:30, reps:r};
}
const CAT_RANKS=['Dabbling','Building','Serious','Sharp','Formidable'];
const catRank=id=>CAT_RANKS[Math.min(CAT_RANKS.length-1,catLevel(id).lv-1)];

// craft titles that evolve with the stage — the identity layer for each skill
const CRAFT_TITLES=['Novice','Apprentice','Practitioner','Craftsman','Master'];
function craftTitle(reps){ const st=stageOf(reps); return reps>=GOAL?'Master':(st.idx>=0?CRAFT_TITLES[st.idx]:'Unstarted'); }

function skillLevel(s){ // 1..10 across the 100 reps
  const r=repCount(s);
  return Math.min(10, Math.floor(r/10)+ (r>0?1:0) - (r>0&&r%10===0&&r<100?0:0));
}
// overall level from total reps
function overallLevel(){
  const r=totalReps();
  let lv=1, need=20, floor=0;
  while(r>=floor+need){ floor+=need; lv++; need=20+(lv-1)*10; }
  return {lv,into:r-floor,need,floor};
}
const RANKS=[[1,'Curious'],[3,'Learner'],[6,'Practitioner'],[10,'Skilled'],[15,'Relentless'],[21,'Unstoppable']];
const rankFor=lv=>RANKS.filter(r=>lv>=r[0]).slice(-1)[0][1];

/* rep streak: distinct days with at least one rep, ending today/yesterday */
function repDays(){return [...new Set(state.skills.flatMap(s=>s.reps.map(r=>r.day)))];}
function streak(){
  const days=new Set(repDays()); let n=0, d=todayStr();
  if(!days.has(d)) d=new Date(Date.now()-86400000), d=iso(d);
  while(days.has(d)){ n++; const p=new Date(d+'T00:00'); p.setDate(p.getDate()-1); d=iso(p); }
  return n;
}
// ---- streak with one grace day per rolling week (insurance) ----
function streakGraced(){
  const days=new Set(repDays());
  let n=0, graceUsed=false, d=todayStr();
  if(!days.has(d)) d=iso(new Date(Date.now()-86400000));
  while(true){
    if(days.has(d)){ n++; }
    else if(!graceUsed && n>0){ graceUsed=true; /* skip one missed day, keep going */ }
    else break;
    const pr=new Date(d+'T00:00'); pr.setDate(pr.getDate()-1); d=iso(pr);
  }
  return {n, graceUsed};
}
// ---- weekly target: reps logged since Monday ----
function weekStart(){ const d=new Date(); const g=(d.getDay()+6)%7; d.setDate(d.getDate()-g); d.setHours(0,0,0,0); return d; }
function repsThisWeek(){ const ws=iso(weekStart()); return state.skills.reduce((a,s)=>a+s.reps.filter(r=>r.day>=ws).length,0); }
const WEEK_GOAL=()=> (state.cfg&&state.cfg.weekGoal) || 7;
// ---- last N days for the chain calendar ----
function chainDays(n){
  const days=new Set(repDays()); const out=[];
  for(let i=n-1;i>=0;i--){ const d=iso(new Date(Date.now()-i*86400000)); out.push({day:d, hit:days.has(d), today:d===todayStr()}); }
  return out;
}

// repair data saved by earlier versions
function migrate(){
  if(!state.skills.length) return;
  const totalRepsLogged=state.skills.reduce((a,s)=>a+((s.reps&&s.reps.length)||0),0);
  const oldSeed=new Set(['lip combos','twerk','public speaking','colour grading','cinematography','sony a7iii','fashion styling','interior design']);
  const looksOldDefault = state.skills.every(s=>oldSeed.has((s.name||'').toLowerCase()));
  // if it's the untouched old default set (no real reps), just replace with the new categorized seed
  if(looksOldDefault && totalRepsLogged===0){ state.skills=seedSkills(); save(); return; }
  // otherwise, gently repair: give every skill a valid category, make everything active
  const validCats=CATS.map(c=>c[0]);
  const seedMap={}; seedSkills().forEach(sk=>{ seedMap[sk.name.toLowerCase()]=sk.cat; });
  // old names -> correct category, so legacy data never lands in the wrong place
  const legacyCat={'lip combos':'beauty','colour grading':'beauty','colour matching':'beauty',
    'fashion styling':'beauty','sony a7iii':'visual','interior design':'space','twerk':'movement',
    'public speaking':'voice','cinematography':'visual'};
  let changed=false;
  state.skills.forEach(sk=>{
    if(!sk.cat || !validCats.includes(sk.cat)){ const nm=(sk.name||'').toLowerCase(); sk.cat=seedMap[nm]||legacyCat[nm]||'business'; changed=true; }
    if(sk.status!=='active'){ sk.status='active'; changed=true; }
    if(!Array.isArray(sk.reps)){ sk.reps=[]; changed=true; }
  });
  if(changed) save();
}

// ---- skill sprint: a short target for this skill by end of week ----
function sprintBlock(s){
  const sp=s.sprint;
  const r=repCount(s);
  if(sp && sp.week===iso(weekStart()) && sp.target>r){
    const start=sp.start||0, gained=r-start, need=sp.target-start;
    const pct=Math.min(100,gained/need*100);
    return `<div class="card" style="box-shadow:none;border-color:var(--go)">
      <div class="cap">Sprint \u00b7 this week</div>
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <b style="font-size:15px;font-weight:800">Reach rep ${sp.target}</b>
        <span style="font-size:13px;font-weight:800;color:var(--go)">${r}/${sp.target}</span></div>
      <div class="pbar" style="margin-top:10px"><i style="width:${pct}%"></i></div>
      <div class="ghostrow"><button class="ghost" data-clearsprint="${s.id}">Cancel sprint</button></div>
    </div>`;
  }
  if(sp && sp.target<=r && sp.week===iso(weekStart())){
    return `<div class="card" style="box-shadow:none;border-color:var(--gold)">
      <div class="cap">Sprint done \u2713</div>
      <p class="lede" style="margin:0">You hit rep ${sp.target} this week. Set another?</p>
      <div class="ghostrow"><button class="ghost" data-setsprint="${s.id}">New sprint</button></div>
    </div>`;
  }
  return `<div class="card" style="box-shadow:none">
    <div class="cap">Sprint</div>
    <p class="lede" style="margin:0 0 12px">Set a short target for this week \u2014 a push closer than 100.</p>
    <button class="ghost" data-setsprint="${s.id}">Set a weekly sprint</button>
  </div>`;
}

function renderSheet(){
  const s=skillById(openSkill); if(!s){closeSheet();return;}
  const r=repCount(s), st=stageOf(r), done=r>=GOAL, avg=avgRating(s);
  const recent=[...s.reps].slice(-8).reverse();
  const ladder=STAGES.map((stg,i)=>{
    const passed=r>stg.to, current=r>=stg.from&&r<=stg.to;
    return `<div class="lrow ${passed?'done':''} ${current?'on':''}">
      <div class="lnum">${stg.from}\\u2013${stg.to}</div>
      <div class="lname">${stg.name}</div>
      <div class="lmark">${passed?'&#10003;':(current?'\\u25b8':'')}</div>
    </div>`;}).join('');

  document.getElementById('sheet').innerHTML=`
    <div class="grab"></div>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
      <h2>${s.name}</h2>
      <button class="ghost" data-skillmenu="${s.id}">Manage</button>
    </div>
    <div class="counter">
      <div class="n">${r}<small>/100</small></div>
      <div class="stagelabel">${done?'Mastered &#10003;':st.name}</div>
      <div class="crafttitle">${craftTitle(r)}${r>0&&!done?` &middot; Level ${skillLevel(s)}`:''}</div>
    </div>
    ${stageBar(r)}

    ${done?`<p class="lede" style="text-align:center;margin-top:16px">100 reps. This skill is yours. ${avg?`You averaged ${avg.toFixed(1)}/5 across the climb.`:''}</p>
      <button class="bigbtn go" data-masterycard="${s.id}" style="margin-top:12px">Create mastery card &nbsp;&#9733;</button>`
    :`<div class="card" style="margin-top:18px;box-shadow:none">
      <div class="cap">Log rep ${r+1}</div>
      <div class="rate" id="rateRow">${[1,2,3,4,5].map(n=>`<button class="rdot ${draft.rating===n?'on':''}" data-rate="${n}">${n}</button>`).join('')}</div>
      <textarea id="repNote" placeholder="One line: how did it go? (optional)">${draft.note}</textarea>
      <button class="bigbtn go" data-logrep="${s.id}" style="margin-top:12px">Log rep ${r+1} &nbsp;&#43;</button>
    </div>`}

    ${!done?sprintBlock(s):''}

    <div class="card" style="box-shadow:none">
      <div class="cap">The climb</div>
      <div class="ladder">${ladder}</div>
    </div>

    ${avg?`<div class="card" style="box-shadow:none">
      <div class="cap">How it's going &middot; avg ${avg.toFixed(1)}/5</div>
      ${ratingTrend(s)}
    </div>`:''}

    ${recent.length?`<div class="card" style="box-shadow:none">
      <div class="cap">Recent reps</div>
      ${recent.map(rep=>`<div class="rep">
        <div class="ri">#${rep.n}</div>
        <div class="rc"><div class="rnote">${rep.note?rep.note:'<span style="color:var(--muted)">no note</span>'}</div>
          <div class="rmeta">${shortDate(rep.at)}</div></div>
        <div class="rstars">${rep.rating?'\\u2605'.repeat(rep.rating)+'\\u2606'.repeat(5-rep.rating):''}</div>
      </div>`).join('')}
    </div>`:''}

    <button class="ghost" data-closesheet="1" style="width:100%;margin-top:6px;padding:15px">Close</button>`;

  wireSheet();
}

function ratingTrend(s){
  const rated=s.reps.filter(r=>r.rating);
  if(rated.length<2) return '<p class="lede" style="margin:0">Log a few rated reps and your improvement line appears here.</p>';
  const W=280,H=70,pad=6;
  const pts=rated.map((r,i)=>{
    const x=pad+(i/(rated.length-1))*(W-pad*2);
    const y=H-pad-((r.rating-1)/4)*(H-pad*2);
    return [x,y];
  });
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="var(--go)"/>`).join('');
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%">
    <path d="${path}" fill="none" stroke="var(--go)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}</svg>`;
}

/* ================= actions ================= */
async function logRep(id){
  const s=skillById(id); if(!s||repCount(s)>=GOAL) return;
  const beforeReps=repCount(s);
  const before=stageOf(beforeReps).idx;
  const n=beforeReps+1;
  const rating=draft.rating||0;
  // context for small-win detection (before pushing)
  const priorRated=s.reps.filter(r=>r.rating);
  const priorAvg=priorRated.length?priorRated.reduce((a,r)=>a+r.rating,0)/priorRated.length:0;
  const priorBest=Math.max(0,...priorRated.map(r=>r.rating));
  const firstToday = !anyRepToday();
  const firstEverInSkill = beforeReps===0;

  s.reps.push({n, rating, note:(draft.note||'').trim(), at:Date.now(), day:todayStr()});
  const after=stageOf(n).idx;
  draft={rating:0,note:''};
  await save();

  // ---- layered celebration: pick the biggest win to headline, confetti scales with it ----
  let big=false;
  if(n>=GOAL){ toast(s.name+' mastered! \u2b50','100 reps. The skill is yours forever.'); big=true; }
  else if(firstEverInSkill){ toast('First rep \u2014 '+s.name+'!','The hardest one is done. 99 to go.'); big=true; }
  else if(after>before){ toast('New stage \u2014 '+STAGES[after].name+'!', s.name+' \u00b7 rep '+n+'. You levelled up.'); big=true; }
  else if([25,50,75].includes(n)){ toast('Rep '+n+' \u00b7 '+s.name, n===50?'Halfway to mastery. Huge.':'Milestone rep. Keep stacking.'); big=true; }
  else if(rating>=5){ toast('A perfect 5 \u2b50','Rep '+n+' of '+s.name+'. That\u2019s the standard now.'); }
  else if(rating && priorRated.length>=3 && rating>priorBest){ toast('Personal best!','Rep '+n+' was your best '+s.name+' yet ('+rating+'/5).'); }
  else if(rating && priorRated.length>=3 && rating>priorAvg+0.5){ toast('You\u2019re improving','Rep '+n+' beat your '+s.name+' average. It\u2019s working.'); }
  else if(firstToday){ toast('First rep of the day','Rep '+n+' of '+s.name+'. Momentum starts now.'); }
  else { toast('Rep '+n+' logged','\u2191 '+s.name+' \u00b7 '+(GOAL-n)+' to mastery.'); }

  confetti(big);
  render(); renderSheet(); checkBadges();
}
const anyRepToday=()=>state.skills.some(s=>s.reps.some(r=>r.day===todayStr()));

/* ================= render ================= */
function render(){
  const onHome=page==='home';
  const gl=document.getElementById('greetLine'), tr=document.getElementById('topRight');
  if(onHome){ gl.textContent=greeting()+', Fatu'; gl.classList.remove('brand'); tr.textContent=longToday(); }
  else { gl.textContent='Fatu\\u2019s 100'; gl.classList.add('brand'); tr.textContent=''; }

  document.getElementById('p-home').innerHTML = page==='home'?homePage():'';
  document.getElementById('p-skills').innerHTML = page==='skills'?(openCat?catPage(openCat):skillsPage()):'';
  document.getElementById('p-prog').innerHTML = page==='prog'?progPage():'';
  ['home','skills','prog'].forEach(p=>document.getElementById('p-'+p).hidden = page!==p);
  document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.dataset.go===page));
  wire();
}

function wire(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;openCat=null;window.scrollTo({top:0,behavior:'smooth'});render();});
  document.querySelectorAll('[data-opencat]').forEach(b=>b.onclick=()=>{openCat=b.dataset.opencat;window.scrollTo({top:0,behavior:'smooth'});render();});
  const back=document.querySelector('[data-backcats]');
  if(back) back.onclick=()=>{openCat=null;window.scrollTo({top:0,behavior:'smooth'});render();};
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openSkillSheet(b.dataset.open));
  const add=document.querySelector('[data-addskill]');
  if(add) add.onclick=addSkill;
  const ex=document.querySelector('[data-export]');
  if(ex) ex.onclick=exportData;
  const im=document.querySelector('[data-import]');
  if(im) im.onclick=importData;
  const sc=document.querySelector('[data-sharecard]');
  if(sc) sc.onclick=makeShareCard;
  const wg=document.querySelector('[data-weekgoal]');
  if(wg) wg.onclick=async()=>{ const v=prompt('Reps per week to aim for:',WEEK_GOAL());
    const n=Number(v); if(n>=1){ state.cfg=state.cfg||{}; state.cfg.weekGoal=Math.round(n); await save(); render(); } };
}

function wireSheet(){
  const box=document.getElementById('sheet');
  box.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{
    draft.rating=Number(b.dataset.rate);
    const note=document.getElementById('repNote'); if(note) draft.note=note.value;

  });
  const note=document.getElementById('repNote');
  if(note) note.oninput=()=>{draft.note=note.value;};
  const lr=box.querySelector('[data-logrep]');
  if(lr) lr.onclick=()=>{const n=document.getElementById('repNote');if(n)draft.note=n.value;logRep(lr.dataset.logrep);};

    const t=Number(v); if(t>r&&t<=GOAL){ sk.sprint={target:Math.round(t),start:r,week:iso(weekStart())}; await save(); renderSheet(); } };
  const csb=box.querySelector('[data-clearsprint]'); if(csb) csb.onclick=async()=>{
    const sk=skillById(csb.dataset.clearsprint); delete sk.sprint; await save(); renderSheet(); };

/* ================= skill management ================= */
async function addSkill(){
  const name=prompt('Name the skill you want to master in 100 reps:');
  if(!name||!name.trim()) return;
  let cat=openCat;
  if(!cat){
    const menu=CATS.map((c,i)=>(i+1)+' = '+c[1]).join('\\n');
    const pick=prompt('Which category?\\n\\n'+menu+'\\n\\nType a number:');
    const ci=Number(pick)-1;
    cat=(ci>=0&&ci<CATS.length)?CATS[ci][0]:'business';
  }
  state.skills.push({id:uid(),name:name.trim(),cat,reps:[],status:'active',created:Date.now()});
  await save(); render(); checkBadges();
}
async function skillMenu(id){
  const s=skillById(id); if(!s) return;
  const c=prompt(s.name+' \u00b7 '+catName(s.cat)+'\\n\\n1 = Rename\\n2 = Change category\\n3 = Delete\\n\\nType 1-3:');
  if(c==='1'){ const nm=prompt('New name:',s.name); if(nm&&nm.trim()) s.name=nm.trim(); }
  else if(c==='2'){ const menu=CATS.map((x,i)=>(i+1)+' = '+x[1]).join('\\n'); const pick=prompt('Move to which category?\\n\\n'+menu,'');
    const ci=Number(pick)-1; if(ci>=0&&ci<CATS.length) s.cat=CATS[ci][0]; }
  else if(c==='3'){ if(confirm('Delete '+s.name+' and all its reps? This cannot be undone.')){ state.skills=state.skills.filter(x=>x.id!==id); closeSheet(); } }
  else return;
  await save(); render(); if(openSkill) renderSheet();
}

/* ================= data io ================= */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='fatu-100-backup-'+todayStr()+'.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000); toast('Backed up','Keep the file safe.');
}
function importData(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.skills))throw 0;
      if(!confirm('Replace everything with this backup?'))return;
      state.skills=d.skills; state.seen=d.seen||[]; state.cfg=Object.assign({weekGoal:7},d.cfg||{}); await save(); page='home'; render(); toast('Restored','Your climb is back.');
    }catch(e){alert('That file could not be read.');}};
    r.readAsText(f);};
  inp.click();
}

/* ================= share card ================= */
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function makeShareCard(){
  const W=1080,H=1350,s=3;
  const c=document.createElement('canvas'); c.width=W*s; c.height=H*s;
  const x=c.getContext('2d'); x.scale(s,s); x.textBaseline='alphabetic';
  const L=overallLevel();
  const closest=[...state.skills].filter(s=>repCount(s)<GOAL).sort((a,b)=>repCount(b)-repCount(a))[0];
  const F=(w,sz)=>`${w} ${sz}px Nunito, system-ui, sans-serif`, RF=sz=>`400 ${sz}px "Varela Round", Nunito, sans-serif`;
  const INK='#0B2A4A', GO='#2563EB', MUT='#5A6E88', LINE='#DCE6F5';

  x.fillStyle='#FFFFFF'; x.fillRect(0,0,W,H);
  const GT=560, g=x.createLinearGradient(0,0,W,GT); g.addColorStop(0,'#123A66'); g.addColorStop(1,'#081F3A');
  x.fillStyle=g; x.fillRect(0,0,W,GT);
  x.fillStyle='rgba(255,255,255,.06)'; x.beginPath(); x.arc(W-60,120,220,0,7); x.fill();

  x.textAlign='left';
  x.fillStyle='#9EC1FF'; x.font=F(900,30); x.letterSpacing='8px'; x.fillText("FATU\\u2019S 100", 72, 120); x.letterSpacing='0px';
  x.fillStyle='#FFFFFF'; x.font=RF(84); x.fillText(rankFor(L.lv), 70, 208);
  x.fillStyle='#BcD6FF'; x.font=F(800,32); x.fillText(`Level ${L.lv}`, 74, 258);
  x.fillStyle='#FFFFFF'; x.font=RF(196); x.fillText(String(totalReps()), 64, 452);
  x.fillStyle='#9EC1FF'; x.font=F(900,38); x.letterSpacing='3px'; x.fillText('TOTAL REPS', 76, 540); x.letterSpacing='0px';

  const stats=[
    [inProgress(),'skills in progress'],
    [masteredCount(),'skills mastered'],
    [state.skills.filter(s=>repCount(s)>0).length,'skills started'],
    [streak(),'day streak'],
    [closest?closest.name:'\\u2013','closest to 100'],
    [closest?repCount(closest)+'/100':'\\u2013','its reps']
  ];
  const gx=64,gap=26,gw=(W-gx*2-gap)/2,gh=150,gyTop=GT+46;
  stats.forEach((st,i)=>{const col=i%2,row=Math.floor(i/2);const bx=gx+col*(gw+gap),by=gyTop+row*(gh+gap);
    x.fillStyle='#F4F7FC'; roundRect(x,bx,by,gw,gh,24); x.fill();
    x.strokeStyle=LINE; x.lineWidth=2; roundRect(x,bx,by,gw,gh,24); x.stroke();
    x.fillStyle=INK; x.font=RF(typeof st[0]==='string'&&st[0].length>6?34:56);
    x.fillText(String(st[0]), bx+28, by+ (typeof st[0]==='string'&&st[0].length>6?70:80));
    x.fillStyle=MUT; x.font=F(900,24); x.letterSpacing='1.5px';
    x.fillText(String(st[1]).toUpperCase(), bx+30, by+120); x.letterSpacing='0px';});

  const dateY=H-84,subY=H-52,ruleY=H-132;
  x.strokeStyle=LINE; x.lineWidth=1.5; x.beginPath(); x.moveTo(72,ruleY); x.lineTo(W-72,ruleY); x.stroke();
  x.textAlign='left'; x.fillStyle=INK; x.font=F(800,27); x.fillText(longToday(), 72, dateY);
  x.fillStyle=MUT; x.font=F(700,22); x.fillText(`${totalReps()} reps and counting`, 72, subY);
  x.textAlign='right'; x.fillStyle=GO; x.font=F(800,24); x.fillText('Unstoppable in the making', W-72, (dateY+subY)/2+2); x.textAlign='left';

  c.toBlob(blob=>{const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download='fatu-100-'+todayStr()+'.png';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Card saved','High-res image in your downloads.');},'image/png');
}

function makeMasteryCard(id){
  const sk=skillById(id); if(!sk) return;
  const W=1080,H=1350,s=3;
  const c=document.createElement('canvas'); c.width=W*s; c.height=H*s;
  const x=c.getContext('2d'); x.scale(s,s); x.textBaseline='alphabetic';
  const avg=avgRating(sk);
  const days=new Set(sk.reps.map(r=>r.day)).size;
  const best=Math.max(0,...sk.reps.map(r=>r.rating||0));
  const F=(w,sz)=>`${w} ${sz}px Nunito, system-ui, sans-serif`, RF=sz=>`400 ${sz}px "Varela Round", Nunito, sans-serif`;
  const INK='#0B2A4A', GO='#2563EB', MUT='#5A6E88', LINE='#DCE6F5', GOLD='#B8892B';

  x.fillStyle='#FFFFFF'; x.fillRect(0,0,W,H);
  // gold-tinted top to mark mastery
  const GT=600, g=x.createLinearGradient(0,0,W,GT); g.addColorStop(0,'#1A3A5C'); g.addColorStop(1,'#0B2A4A');
  x.fillStyle=g; x.fillRect(0,0,W,GT);
  x.fillStyle='rgba(184,137,43,.16)'; x.beginPath(); x.arc(W-70,150,240,0,7); x.fill();

  x.textAlign='left';
  x.fillStyle=GOLD; x.font=F(900,30); x.letterSpacing='8px'; x.fillText('MASTERED \u2605', 72, 130); x.letterSpacing='0px';
  // skill name, wrapped if long
  x.fillStyle='#FFFFFF'; x.font=RF(74);
  const words=sk.name.split(' '); let line='',yy=230;
  words.forEach(w=>{ const t=(line?line+' ':'')+w; if(x.measureText(t).width>W-150&&line){ x.fillText(line,70,yy); yy+=80; line=w; } else line=t; });
  x.fillText(line,70,yy);
  x.fillStyle='#9EC1FF'; x.font=F(800,32); x.fillText(catName(sk.cat), 74, yy+52);

  x.fillStyle='#FFFFFF'; x.font=RF(184); x.fillText('100', 64, 540);
  x.fillStyle=GOLD; x.font=F(900,38); x.letterSpacing='3px'; x.fillText('REPS COMPLETE', 76, 588); x.letterSpacing='0px';

  const stats=[[days,'days of work'],[avg?avg.toFixed(1)+'/5':'\u2013','average rating'],[best||'\u2013','best rep'],['\u2605\u2605\u2605\u2605\u2605','the standard']];
  const gx=64,gap=26,gw=(W-gx*2-gap)/2,gh=150,gyTop=GT+56;
  stats.forEach((st,i)=>{const col=i%2,row=Math.floor(i/2);const bx=gx+col*(gw+gap),by=gyTop+row*(gh+gap);
    x.fillStyle='#F4F7FC'; roundRect(x,bx,by,gw,gh,24); x.fill(); x.strokeStyle=LINE; x.lineWidth=2; roundRect(x,bx,by,gw,gh,24); x.stroke();
    const isStars=String(st[0]).includes('\u2605');
    x.fillStyle=isStars?GOLD:INK; x.font=RF(isStars?40:56); x.fillText(String(st[0]), bx+28, by+ (isStars?76:80));
    x.fillStyle=MUT; x.font=F(900,24); x.letterSpacing='1.2px'; x.fillText(String(st[1]).toUpperCase(), bx+30, by+120); x.letterSpacing='0px';});

  const dateY=H-84,subY=H-52,ruleY=H-132;
  x.strokeStyle=LINE; x.lineWidth=1.5; x.beginPath(); x.moveTo(72,ruleY); x.lineTo(W-72,ruleY); x.stroke();
  x.textAlign='left'; x.fillStyle=INK; x.font=F(800,27); x.fillText(longToday(), 72, dateY);
  x.fillStyle=MUT; x.font=F(700,22); x.fillText('Fatu\u2019s 100 \u00b7 a skill mastered', 72, subY);
  x.textAlign='right'; x.fillStyle=GOLD; x.font=F(800,24); x.fillText('Unstoppable', W-72, (dateY+subY)/2+2); x.textAlign='left';

  c.toBlob(blob=>{const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download='fatu-mastered-'+sk.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.png';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast('Mastery card saved','A keepsake for '+sk.name+'.');},'image/png');
}
