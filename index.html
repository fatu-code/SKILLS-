<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fatu's 100</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B2A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fatu 100">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B2A4A; --go:#2563EB; --sky:#BFD6FF; --wash:#EDF3FE;
    --paper:#F4F7FC; --line:#DCE6F5; --muted:#5A6E88; --park:#8A9BB4;
    --gold:#B8892B; --bronze:#A9793F; --silver:#7E8E86;
    --shadow:0 1px 2px rgba(11,42,74,.05), 0 6px 20px rgba(11,42,74,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:Nunito,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:'Varela Round',Nunito,sans-serif;font-weight:400;margin:0}
  button{font-family:Nunito,sans-serif;font-weight:800;border:0;cursor:pointer;transition:all .16s ease}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--go);outline-offset:2px}
  input,textarea,select{font-family:Nunito,sans-serif;font-weight:700;color:var(--ink);background:var(--paper);
    border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;outline:none;width:100%;font-size:16px}
  input:focus,textarea:focus{border-color:var(--go);background:#fff;box-shadow:0 0 0 4px var(--wash)}
  .app{max-width:620px;margin:0 auto;padding:18px max(22px,env(safe-area-inset-left)) 116px max(22px,env(safe-area-inset-left))}

  .topbar{position:sticky;top:0;z-index:25;background:#fff;border-bottom:1.5px solid var(--line);
    margin:-18px 0 18px;padding-top:env(safe-area-inset-top)}
  .tinner{max-width:620px;margin:0 auto;padding:14px calc(24px + env(safe-area-inset-left)) 14px calc(24px + env(safe-area-inset-left));display:flex;align-items:center;gap:13px}
  .hstack{display:flex;flex-direction:column;gap:2px;min-width:0}
  .greet{font-weight:800;font-size:17px;color:var(--ink);letter-spacing:-.01em;line-height:1.15}
  .greet.brand{font-size:0}
  .wordmark{display:inline-flex;align-items:center;gap:7px;font-family:'Varela Round',sans-serif}
  .wm-name{font-size:21px;color:var(--ink);letter-spacing:-.015em}
  .wm-num{font-size:19px;color:#fff;background:var(--ink);border-radius:10px;padding:3px 10px 4px;letter-spacing:.02em;
    box-shadow:0 2px 8px rgba(11,42,74,.22)}
  .tdate{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;letter-spacing:.01em}

  .cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:7px}
  .card{background:#fff;border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px;margin-bottom:12px}
  .lede{font-size:14px;font-weight:700;color:var(--muted);line-height:1.6;margin-top:8px}
  .metaline{font-size:13px;font-weight:700;color:var(--muted);margin-top:12px;line-height:1.6}
  .metaline b{color:var(--ink)}
  .phead{margin:4px 4px 16px}
  .phead h1{font-size:26px}
  .phead p{font-size:13px;font-weight:700;color:var(--muted);margin:6px 0 0;line-height:1.5}

  /* dashboard stat tiles */
  .quad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
  .stat b{display:block;font-family:'Varela Round',sans-serif;font-size:27px;line-height:1}
  .stat b.sm{font-size:19px}
  .stat span{display:block;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:6px}
  .stat.accent b{color:var(--go)}

  /* skill card */
  .skill{background:#fff;border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px;margin-bottom:12px;cursor:pointer;transition:border-color .16s}
  .skill:hover{border-color:var(--go)}
  .skill .stop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .skill h3{font-size:19px}
  .skill .scat{font-size:11px;font-weight:800;color:var(--muted);margin-top:3px;letter-spacing:.02em}
  .skill .stage{font-size:11px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--go);
    background:var(--wash);border-radius:99px;padding:5px 11px;white-space:nowrap}
  .skill .stage.done{color:#fff;background:var(--gold)}
  .repline{display:flex;align-items:baseline;gap:8px;margin:12px 0 8px}
  .repline b{font-family:'Varela Round',sans-serif;font-size:30px;line-height:1}
  .repline span{font-size:13px;font-weight:700;color:var(--muted)}
  .pbar{height:10px;background:var(--wash);border-radius:99px;overflow:hidden;position:relative}
  .pbar i{display:block;height:100%;background:var(--go);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .pbar i.gold{background:var(--gold)}
  /* stage ticks on the bar */
  .pbar u{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.7)}

  .cathead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:20px 4px 10px}
  .cathead:first-of-type{margin-top:4px}
  .catname{font-family:'Varela Round',sans-serif;font-size:16px;color:var(--ink)}
  .catmeta{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.02em}
  .cattiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .ctile{background:#fff;border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
    padding:18px 16px;text-align:left;display:flex;flex-direction:column;gap:0;min-height:132px;position:relative;overflow:hidden}
  .ctile:hover{border-color:var(--go)}
  .ctile .cicon{width:26px;height:26px;stroke:var(--go);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-bottom:12px}
  .ctile .cname{font-family:'Varela Round',sans-serif;font-size:16px;color:var(--ink);line-height:1.15}
  .ctile .cmeta{font-size:11px;font-weight:800;color:var(--muted);margin-top:5px;letter-spacing:.02em}
  .ctile .cbar{height:6px;background:var(--wash);border-radius:99px;overflow:hidden;margin-top:auto}
  .ctile .cbar i{display:block;height:100%;background:var(--go);border-radius:99px;transition:width .5s ease}
  .backbtn{background:none;border:0;color:var(--muted);font-size:13px;font-weight:800;padding:4px 0;letter-spacing:.02em}
  .backbtn:hover{color:var(--go)}
  .chaingrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .chaincell{aspect-ratio:1;border-radius:7px;background:var(--wash);border:1.5px solid var(--line)}
  .chaincell.hit{background:var(--go);border-color:var(--go)}
  .chaincell.today{box-shadow:0 0 0 2px var(--ink)}
  .chaincell.today.hit{box-shadow:0 0 0 2px var(--gold)}
  .chainmeta{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted);margin-top:12px}
  .chainmeta b{color:var(--ink);font-family:'Varela Round',sans-serif;font-size:15px}
  .chainmeta em{font-style:normal;color:var(--gold)}
  .mission{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--paper)}
  .mission:last-child{border-bottom:0}
  .mission .mtick{width:24px;height:24px;flex-shrink:0;border-radius:8px;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:900;transition:all .16s}
  .mission.done .mtick{background:var(--go);border-color:var(--go)}
  .mission .mname{flex:1;font-size:15px;font-weight:800;color:var(--ink)}
  .mission.done .mname{color:var(--muted)}
  .mission .mpts{font-size:12px;font-weight:900;letter-spacing:.04em;color:var(--muted)}
  .mission.done .mpts{color:var(--go)}
  .parked{opacity:.6}
  .parktag{font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--park);
    background:var(--paper);border:1.5px solid var(--line);border-radius:99px;padding:4px 9px}

  .bigbtn{width:100%;background:var(--ink);color:#fff;border-radius:14px;padding:16px;font-size:16px;margin-top:4px}
  .bigbtn:hover{background:var(--go)}
  .bigbtn.go{background:var(--go)}
  .ghost{background:#fff;border:1.5px solid var(--line);color:var(--muted);border-radius:12px;padding:11px 16px;
    font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  .ghost:hover{border-color:var(--go);color:var(--ink)}
  .ghostrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

  /* skill detail: big counter */
  .counter{text-align:center;padding:10px 0 4px}
  .counter .n{font-family:'Varela Round',sans-serif;font-size:88px;line-height:.9;color:var(--go)}
  .counter .n small{font-size:30px;color:var(--muted)}
  .counter .stagelabel{font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-top:8px}
  .counter .crafttitle{font-family:'Varela Round',sans-serif;font-size:15px;color:var(--go);margin-top:6px}

  /* stage ladder */
  .ladder{display:flex;flex-direction:column;gap:7px;margin-top:6px}
  .lrow{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:13px;background:var(--paper);border:1.5px solid var(--line)}
  .lrow.on{background:var(--wash);border-color:var(--go)}
  .lrow.done{background:#fff;border-color:var(--gold)}
  .lrow .lnum{min-width:52px;flex-shrink:0;white-space:nowrap;font-family:'Varela Round',sans-serif;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .lrow.on .lnum,.lrow.done .lnum{color:var(--ink)}
  .lrow .lname{flex:1;font-size:15px;font-weight:800}
  .lrow .lmark{font-size:14px;font-weight:900;color:var(--line)}
  .lrow.done .lmark{color:var(--gold)}
  .lrow.on .lmark{color:var(--go)}

  /* rating dots */
  .rate{display:flex;gap:10px;justify-content:center;margin:14px 0}
  .rdot{width:44px;height:44px;border-radius:99px;border:2px solid var(--line);background:#fff;color:var(--muted);
    font-family:'Varela Round',sans-serif;font-size:18px;display:flex;align-items:center;justify-content:center}
  .rdot.on{background:var(--go);border-color:var(--go);color:#fff}
  .rdot:hover{border-color:var(--go)}

  /* rep history */
  .rep{display:flex;gap:12px;padding:12px 6px;border-bottom:1px solid var(--paper);border-radius:10px;cursor:pointer;transition:background .15s}
  .rep:hover{background:var(--paper)}
  .rep .edithint{font-size:11px;font-weight:800;color:var(--park);letter-spacing:.03em}
  .rep:last-child{border-bottom:0}
  .rep .ri{width:40px;flex-shrink:0;font-family:'Varela Round',sans-serif;font-size:16px;color:var(--go)}
  .rep .rc{flex:1;min-width:0}
  .rep .rc .rnote{font-size:14px;font-weight:700}
  .rep .rc .rmeta{font-size:12px;font-weight:700;color:var(--muted);margin-top:2px}
  .rep .rstars{font-size:12px;color:var(--gold);white-space:nowrap;font-weight:900}

  /* rating trend */
  .trend{height:80px;margin-top:10px;position:relative}

  /* badges */
  .badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
  .badge{border:1.5px solid var(--line);border-radius:16px;padding:14px;background:var(--paper);position:relative}
  .badge.got{background:#fff}
  .badge.got.t1{border-color:var(--bronze)} .badge.got.t2{border-color:var(--silver)} .badge.got.t3{border-color:var(--gold)}
  .badge b{display:block;font-size:13px;font-weight:800;color:var(--muted);padding-right:18px}
  .badge.got b{color:var(--ink)}
  .badge .sub{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-top:4px;line-height:1.4}
  .badge .mark{position:absolute;top:12px;right:12px;font-size:14px;color:var(--line);font-weight:900}
  .badge.got.t1 .mark{color:var(--bronze)} .badge.got.t2 .mark{color:var(--silver)} .badge.got.t3 .mark{color:var(--gold)}
  .badge .mini{height:5px;background:var(--wash);border-radius:99px;margin-top:9px;overflow:hidden}
  .badge .mini i{display:block;height:100%;background:var(--park);border-radius:99px}
  .badge .pts{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px;display:block}

  /* rank block */
  .yeargrid{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;align-items:end;height:96px}
  .ycol{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
  .ybar{flex:1;width:100%;background:var(--wash);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}
  .ybar i{display:block;width:100%;background:var(--go);border-radius:5px;min-height:2px;transition:height .5s ease}
  .ycol span{font-size:9px;font-weight:800;color:var(--muted)}
  .badge.secret{background:repeating-linear-gradient(45deg,var(--paper),var(--paper) 8px,#EEF3FB 8px,#EEF3FB 16px);border-style:dashed}
  .badge.secret b{color:var(--park)} .badge.secret .mark{color:var(--park)}
  .rankladder{display:flex;flex-direction:column;gap:2px}
  .rrow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px}
  .rrow.reached{background:var(--wash)}
  .rrow.current{background:var(--ink);color:#fff}
  .rrow .rdotm{width:20px;flex-shrink:0;text-align:center;font-weight:900;color:var(--go);font-size:13px}
  .rrow.current .rdotm{color:#9EC1FF}
  .rrow .rrank{flex:1;font-family:'Varela Round',sans-serif;font-size:16px}
  .rrow .rreq{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.02em}
  .rrow.current .rreq{color:rgba(255,255,255,.75)}
  .ladderinfo{display:flex;flex-direction:column;gap:12px;margin-top:12px}
  .linfo b{display:block;font-size:15px;font-weight:800;color:var(--ink)}
  .linfo span{display:block;font-size:13px;font-weight:700;color:var(--muted);line-height:1.5;margin-top:3px}
  /* play: wheel */
  .wheelcard{background:linear-gradient(150deg,#123A66,#081F3A);color:#fff;border-radius:22px;padding:22px;margin-bottom:12px;text-align:center}
  .wheelwrap{position:relative;width:230px;height:230px;margin:8px auto 18px}
  .wheel{width:230px;height:230px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.3))}
  .wheelpin{position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:2;
    width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--gold)}
  .playstash{display:flex;justify-content:center;gap:20px;margin-top:14px;font-size:13px;font-weight:800;color:var(--sky)}
  .chestcard{border-color:var(--gold);background:linear-gradient(180deg,#fff,#FFF8EC)}
  /* scratch */
  .scratch{border-color:var(--sky)}
  /* dice */
  .dice.ddone{background:var(--wash);border-color:var(--soft)}
  .dieface{width:46px;height:46px;flex-shrink:0;border-radius:13px;background:var(--wash);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--go);line-height:1}
  .dice.ddone .dieface{background:var(--go);color:#fff}
  /* login ladder */
  .ladder{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
  .lad{border:1.5px solid var(--line);border-radius:11px;padding:9px 2px;text-align:center;background:var(--paper);position:relative}
  .lad span{display:block;font-size:9px;font-weight:800;color:var(--muted);letter-spacing:.02em}
  .lad b{display:block;font-family:'Varela Round',sans-serif;font-size:14px;color:var(--muted);margin-top:2px}
  .lad.on{background:var(--wash);border-color:var(--soft)}
  .lad.on b{color:var(--go)}
  .lad.today{border-color:var(--go);box-shadow:0 0 0 3px var(--wash)}
  .lad.today b{color:var(--go)}
  .lad em{display:block;font-style:normal;font-size:8px;font-weight:800;color:var(--go);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
  /* focus card */
  .focuscard{background:linear-gradient(150deg,#1B4E86,#0B2A4A);color:#fff;border-radius:22px;padding:22px;margin-bottom:12px;position:relative;overflow:hidden}
  .focuscard:after{content:'';position:absolute;right:-40px;bottom:-50px;width:180px;height:180px;border-radius:50%;background:rgba(37,99,235,.18)}
  .fctop{display:flex;align-items:center;justify-content:space-between;position:relative}
  .fcswap{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:99px;padding:6px 13px;font-size:11px;font-weight:800;letter-spacing:.03em}
  .fcname{font-size:26px;margin:6px 0 2px;position:relative;color:#fff}
  .fcmeta{font-size:12.5px;font-weight:700;color:var(--sky);position:relative}
  .fccount{display:flex;align-items:baseline;gap:6px;margin:14px 0 10px;position:relative}
  .fccount b{font-family:'Varela Round',sans-serif;font-size:44px;line-height:1;color:#fff}
  .fccount span{font-size:16px;font-weight:700;color:var(--sky)}
  .fcbar{height:10px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;position:relative;margin-bottom:16px}
  .fcbar i{display:block;height:100%;background:var(--mid);border-radius:99px;transition:width .5s ease}
  .bigbtn.fclog{background:#fff;color:var(--ink);position:relative;box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .bigbtn.fclog:hover{background:var(--sky)}
  .focusempty{border-style:dashed}
  /* quest */
  .quest.qdone{background:var(--wash);border-color:var(--soft)}
  .qbolt{width:42px;height:42px;flex-shrink:0;border-radius:12px;background:var(--wash);display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--go)}
  .quest.qdone .qbolt{background:var(--go);color:#fff}
  .qpts{font-family:'Varela Round',sans-serif;font-size:16px;color:var(--go)}
  .quest.qdone .qpts{color:var(--muted)}
  /* comeback */
  .comeback{border-color:var(--go);background:linear-gradient(180deg,#fff,var(--wash))}
  .timeline{display:flex;flex-direction:column;gap:2px}
  .tl{display:flex;gap:14px;padding:10px 0;position:relative}
  .tl:not(:last-child):before{content:'';position:absolute;left:17px;top:38px;bottom:-2px;width:2px;background:var(--wash)}
  .tldot{width:36px;height:36px;flex-shrink:0;border-radius:50%;background:var(--wash);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--go);z-index:1}
  .tl.mastery .tldot{background:var(--gold);color:#fff}
  .tl.stage .tldot{background:var(--go);color:#fff}
  .tl.total .tldot{background:var(--ink);color:#fff}
  .tlc{flex:1;min-width:0;padding-top:2px}
  .tlc b{display:block;font-size:14.5px;font-weight:800;line-height:1.3}
  .tlc span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
  .bagrid{display:flex;align-items:stretch;gap:10px;margin-top:6px}
  .ba{flex:1;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px}
  .ba span{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .ba b{display:block;font-family:'Varela Round',sans-serif;font-size:26px;margin-top:4px}
  .ba b.go{color:var(--go)}
  .ba em{display:block;font-style:normal;font-size:11.5px;font-weight:600;color:var(--muted);margin-top:6px;line-height:1.4}
  .baarrow{display:flex;align-items:center;color:var(--muted);font-size:20px;font-weight:800}
  .ptshero{background:linear-gradient(150deg,#123A66,#081F3A);color:#fff;border-radius:22px;padding:22px;margin-bottom:12px;position:relative;overflow:hidden}
  .ptshero:after{content:'';position:absolute;right:-30px;top:-30px;width:170px;height:170px;border-radius:50%;background:rgba(37,99,235,.16)}
  .ptsnum{font-family:'Varela Round',sans-serif;font-size:52px;line-height:1;letter-spacing:-.01em;position:relative}
  .ptssub{font-size:12.5px;font-weight:700;color:var(--sky);margin-top:8px;position:relative}
  .ptsbreak{display:flex;gap:16px;margin-top:16px;position:relative;flex-wrap:wrap}
  .ptsbreak span{font-size:12px;font-weight:700;color:rgba(255,255,255,.72)}
  .ptsbreak b{font-family:'Varela Round',sans-serif;color:#fff;font-size:14px;margin-right:2px}
  .rank{display:flex;align-items:center;gap:16px}
  .rank .lv{width:74px;height:74px;flex-shrink:0;border-radius:22px;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .rank .lv b{font-family:'Varela Round',sans-serif;font-size:29px;line-height:1}
  .rank .lv span{font-size:8px;letter-spacing:.14em;text-transform:uppercase;margin-top:3px;opacity:.75}
  .rank .who{flex:1}
  .rank .who h2{font-size:22px}
  .xpbar{height:9px;background:var(--wash);border-radius:99px;overflow:hidden;margin-top:10px}
  .xpbar i{display:block;height:100%;background:var(--go);border-radius:99px;transition:width .6s ease}
  .pcts{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--muted);margin-top:7px}

  /* modal / sheet */
  .scrim{position:fixed;inset:0;z-index:50;background:rgba(11,30,55,.4);backdrop-filter:blur(3px)}
  .scrim[hidden]{display:none}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:620px;margin:0 auto;background:var(--paper);
    border-radius:26px 26px 0 0;max-height:90vh;overflow-y:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 40px rgba(11,42,74,.22);animation:rise .28s cubic-bezier(.2,.85,.25,1)}
  .sheet[hidden]{display:none}
  @keyframes rise{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
  .grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:8px auto 14px}
  .sheettop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
  .sheettop .backbtn{font-size:15px;font-weight:800;color:var(--muted);padding:6px 2px}
  .sheettop .backbtn:hover{color:var(--go)}
  .sheet h2{font-size:23px;margin-bottom:4px}
  textarea{resize:none;min-height:64px}

  /* toast */
  .toast{position:fixed;left:16px;right:16px;bottom:96px;z-index:60;max-width:588px;margin:0 auto;background:var(--ink);color:#fff;
    border-radius:18px;padding:16px 18px;box-shadow:0 12px 34px rgba(11,42,74,.3);animation:pop .35s cubic-bezier(.2,.9,.25,1)}
  .toast[hidden]{display:none}
  .ptspop{position:fixed;left:50%;top:46%;transform:translateX(-50%);z-index:75;pointer-events:none;
    font-family:'Varela Round',sans-serif;font-size:44px;color:var(--go);font-weight:400;
    text-shadow:0 2px 12px rgba(37,99,235,.35);animation:ptsrise 1.3s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes ptsrise{0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.7)}
    18%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.1)}
    32%{transform:translateX(-50%) translateY(0) scale(1)}
    100%{opacity:0;transform:translateX(-50%) translateY(-60px) scale(1)}}
  .confetti{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
  .confetti i{position:absolute;top:32%;display:block;opacity:0;animation-name:fall;animation-timing-function:cubic-bezier(.25,.6,.4,1);animation-fill-mode:forwards}
  @keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),64vh) rotate(var(--rot))}}
  .toast b{display:block;font-family:'Varela Round',sans-serif;font-size:17px}
  .toast span{display:block;font-size:12px;font-weight:700;opacity:.85;margin-top:3px}
  @keyframes pop{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}

  /* bottom nav */
  .bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);
    border-top:1.5px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
  .bottominner{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
  .nb{background:none;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;color:var(--park);
    font-size:11px;letter-spacing:.03em;font-weight:800;border-radius:14px}
  .nb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .nb.on{color:var(--ink)} .nb.on svg{stroke:var(--go)}
  .page[hidden]{display:none}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="topbar"><div class="tinner">
  <div class="hstack">
    <div class="greet" id="greetLine"></div>
    <div class="tdate" id="topRight"></div>
  </div>
</div></header>

<div class="app">
  <section class="page" id="p-home"></section>
  <section class="page" id="p-skills" hidden></section>
  <section class="page" id="p-play" hidden></section>
  <section class="page" id="p-prog" hidden></section>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<nav class="bottom"><div class="bottominner">
  <button class="nb on" data-go="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button class="nb" data-go="skills"><svg viewBox="0 0 24 24"><path d="M12 3l2.5 5 5.5.8-4 3.9 1 5.5L12 21l-5 2.6 1-5.5-4-3.9 5.5-.8z"/></svg>Skills</button>
  <button class="nb" data-go="play"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="2.5"/></svg>Play</button>
  <button class="nb" data-go="prog"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H3"/></svg>Progress</button>
</div></nav>

<script>
/* ================= storage ================= */
const store={
  async get(k){ if(window.storage&&window.storage.get){try{const r=await window.storage.get(k);return r&&r.value?r.value:null;}catch(e){return null;}}
    try{return localStorage.getItem(k);}catch(e){return null;} },
  async set(k,v){ if(window.storage&&window.storage.set){try{return await window.storage.set(k,v);}catch(e){}}
    try{localStorage.setItem(k,v);}catch(e){} }
};
const KEY='fatu-100-v4';

/* ================= model ================= */
// stage names with their share of the journey (fractions of the goal).
// these five bands scale to whatever a skill's target is.
const STAGES=[
  {name:'Beginner',      lo:0.00, hi:0.10},
  {name:'Finding it',    lo:0.10, hi:0.30},
  {name:'Getting good',  lo:0.30, hi:0.60},
  {name:'Sharp',         lo:0.60, hi:0.90},
  {name:'Mastery',       lo:0.90, hi:1.00}
];
const DEFAULT_GOAL=100;
const goalOf=s=>(s&&s.goal)||DEFAULT_GOAL;
// the take-range each stage covers for a given goal (1-indexed, inclusive)
function stageBands(goal){
  return STAGES.map((st,i)=>{
    const from=Math.floor(st.lo*goal)+1;
    const to=(i===STAGES.length-1)?goal:Math.floor(st.hi*goal);
    return {idx:i,name:st.name,from:Math.max(1,from),to:Math.max(from,to)};
  });
}
// stage for a given take count within a goal
function stageOfN(reps,goal){
  if(reps<=0) return {idx:-1,name:'Not started',from:0,to:0};
  const bands=stageBands(goal);
  for(const b of bands){ if(reps>=b.from && reps<=b.to) return b; }
  return bands[bands.length-1];
}
// convenience: stage for a whole skill object
const stageOf=s=>{
  if(typeof s==='number') return stageOfN(s,DEFAULT_GOAL);       // back-compat if a number slips in
  return stageOfN(repCount(s),goalOf(s));
};

const uid=()=>'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const CATS=[
  ['visual','Visual craft','M3 16l5-5 4 4 5-6 4 5M4 20h16'],
  ['voice','Voice & presence','M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM6 11a6 6 0 0 0 12 0M12 17v4'],
  ['beauty','Beauty & style','M12 3l2.5 5 5.5.8-4 3.9 1 5.5L12 21l-5 2.7 1-5.5-4-3.9 5.5-.8z'],
  ['movement','Movement','M13 4a1.5 1.5 0 1 0 0-.01M8 21l3-6 3 2 1 4M11 15l-2-4 5-2 3 3'],
  ['space','Space','M3 21V9l9-6 9 6v12M9 21v-6h6v6'],
  ['culture','Culture','M9 18V5l12-2v13M9 13l12-2M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z'],
  ['business','Business','M3 7h18v12H3zM8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18']
];
const catName=id=>{const c=CATS.find(c=>c[0]===id);return c?c[1]:'Other';};
const catIcon=id=>{const c=CATS.find(c=>c[0]===id);return c?c[2]:'';};
function seedSkills(){
  const seed=[
    ['Photography','visual'],['Cinematography','visual'],['Sony A7III','visual'],['Lightroom editing','visual'],
    ['Public speaking','voice'],['Storytelling','voice'],['Emotional intelligence','voice'],
    ['Lip combo','beauty'],['Baby hair / edges','beauty'],['Fashion tips','beauty'],['Colour matching','beauty'],
    ['Twerk','movement'],['Zep','movement'],
    ['Interior design','space'],
    ['Local song lyrics','culture'],
    ['Branding','business'],['Leads','business'],['Offers','business'],['Financial education','business']
  ];
  // every skill you named starts active and visible; park is yours to use later, by choice
  return seed.map(([n,cat])=>({id:uid(),name:n,cat,reps:[],status:'active',created:Date.now()}));
}

let state={skills:[],seen:[],cfg:{weekGoal:7},focus:null,lastSeen:null,bonusPts:0,play:{lastSpin:null,freezes:0,chests:0,loginDay:0,loginDate:null,lastScratch:null,lastDice:null,diceChallenge:null,doubleNext:false}};
let page='home', openSkill=null, openCat=null;
let draft={rating:0, note:''};   // rep being logged

/* ================= dates ================= */
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const todayStr=()=>iso(new Date());
const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MO=['January','February','March','April','May','June','July','August','September','October','November','December'];
const ord=d=>(d>3&&d<21)?d+'th':d+({1:'st',2:'nd',3:'rd'}[d%10]||'th');
const longToday=()=>{const d=new Date();return DN[d.getDay()]+' '+ord(d.getDate())+' '+MO[d.getMonth()];};
const shortDate=ms=>{const d=new Date(ms);return DN[d.getDay()].slice(0,3)+' '+ord(d.getDate())+' '+MO[d.getMonth()].slice(0,3);};
const greeting=()=>{const h=new Date().getHours();return h<12?'Good morning':(h<17?'Good afternoon':'Good evening');};

/* ================= derived ================= */
const repCount=s=>s.reps.length;
const skillById=id=>state.skills.find(s=>s.id===id);
const activeSkills=()=>state.skills;   // nothing is ever parked, all skills are active
const totalReps=()=>state.skills.reduce((a,s)=>a+repCount(s),0);
const masteredCount=()=>state.skills.filter(s=>repCount(s)>=goalOf(s)).length;
const inProgress=()=>state.skills.filter(s=>repCount(s)>0 && repCount(s)<goalOf(s)).length;
const avgRating=s=>{const r=s.reps.filter(x=>x.rating);return r.length?r.reduce((a,x)=>a+x.rating,0)/r.length:0;};

/* points: rep=10, crossing into a new stage=+40, finishing 100=+150 (all baked into level math) */
function skillPoints(s){
  let p=repCount(s)*10;
  const st=stageOf(s);
  p += Math.max(0,st.idx)*40;        // stages passed
  if(repCount(s)>=goalOf(s)) p+=150;
  return p;
}
function badgePoints(){ try{ return badgeState().filter(b=>b.got).reduce((a,b)=>a+(b.pts||0),0); }catch(e){ return 0; } }
const totalPoints=()=>state.skills.reduce((a,s)=>a+skillPoints(s),0)+badgePoints()+(state.bonusPts||0);
// the exact points a single take earns right now (for the +N pop): base 10, +40 if it crosses a stage, +150 if it masters
function takePointsFor(s, n){
  const goal=goalOf(s);
  let p=10;
  const before=stageOfN(n-1,goal).idx, after=stageOfN(n,goal).idx;
  if(after>before && before>=0) p+=40;   // crossing between real stages, not the very first take
  if(n>=goal) p+=150;
  return p;
}

// ---- category aggregates ----
const catReps=id=>state.skills.filter(s=>s.cat===id).reduce((a,s)=>a+repCount(s),0);
const catSkills=id=>state.skills.filter(s=>s.cat===id);
function catLevel(id){ // a category levels every 30 reps within it
  const r=catReps(id); return {lv:Math.floor(r/30)+1, into:r%30, need:30, reps:r};
}
const CAT_RANKS=['Dabbling','Building','Serious','Sharp','Formidable'];
const catRank=id=>CAT_RANKS[Math.min(CAT_RANKS.length-1,catLevel(id).lv-1)];

// craft titles that evolve with the stage, the identity layer for each skill
const CRAFT_TITLES=['Novice','Apprentice','Practitioner','Craftsman','Master'];
function craftTitle(reps,goal){ goal=goal||DEFAULT_GOAL; const st=stageOfN(reps,goal); return reps>=goal?'Master':(st.idx>=0?CRAFT_TITLES[st.idx]:'Unstarted'); }

function skillLevel(s){ // 1..10 across the skill's own target
  const r=repCount(s), goal=goalOf(s);
  if(r<=0) return 1;
  return Math.min(10, Math.ceil(r/goal*10));
}
// overall level from total takes
function overallLevel(){
  const r=totalReps();
  let lv=1, need=20, floor=0;
  while(r>=floor+need){ floor+=need; lv++; need=20+(lv-1)*10; }
  return {lv,into:r-floor,need,floor};
}
const RANKS=[[1,'Curious'],[3,'Learner'],[6,'Practitioner'],[10,'Skilled'],[15,'Relentless'],[21,'Unstoppable']];
const rankFor=lv=>RANKS.filter(r=>lv>=r[0]).slice(-1)[0][1];
// total takes needed to reach a given overall level (for the explainer)
function repsForLevel(target){ let lv=1,need=20,floor=0; while(lv<target){ floor+=need; lv++; need=20+(lv-1)*10; } return floor; }
// the rep total at which each rank begins
function rankThresholds(){ return RANKS.map(([lv,name])=>({name,lv,reps:repsForLevel(lv)})); }

/* rep streak: distinct days with at least one rep, ending today/yesterday */
function repDays(){return [...new Set(state.skills.flatMap(s=>s.reps.map(r=>r.day)))];}
function streak(){
  const days=new Set(repDays()); let n=0, d=todayStr();
  if(!days.has(d)) d=new Date(Date.now()-86400000), d=iso(d);
  while(days.has(d)){ n++; const p=new Date(d+'T00:00'); p.setDate(p.getDate()-1); d=iso(p); }
  return n;
}
// ---- streak with one grace day per rolling week (insurance) ----
function streakGraced(){
  const days=new Set(repDays());
  let n=0, graceUsed=false, d=todayStr();
  if(!days.has(d)) d=iso(new Date(Date.now()-86400000));
  while(true){
    if(days.has(d)){ n++; }
    else if(!graceUsed && n>0){ graceUsed=true; /* skip one missed day, keep going */ }
    else break;
    const pr=new Date(d+'T00:00'); pr.setDate(pr.getDate()-1); d=iso(pr);
  }
  return {n, graceUsed};
}
// ---- weekly target: reps logged since Monday ----
function weekStart(){ const d=new Date(); const g=(d.getDay()+6)%7; d.setDate(d.getDate()-g); d.setHours(0,0,0,0); return d; }
function repsThisWeek(){ const ws=iso(weekStart()); return state.skills.reduce((a,s)=>a+s.reps.filter(r=>r.day>=ws).length,0); }
const WEEK_GOAL=()=> (state.cfg&&state.cfg.weekGoal) || 7;
// ---- last N days for the chain calendar ----
function chainDays(n){
  const days=new Set(repDays()); const out=[];
  for(let i=n-1;i>=0;i--){ const d=iso(new Date(Date.now()-i*86400000)); out.push({day:d, hit:days.has(d), today:d===todayStr()}); }
  return out;
}

/* ================= storage io ================= */
async function load(){
  try{const raw=await store.get(KEY);
    if(raw){const s=JSON.parse(raw); state.skills=s.skills||[]; state.seen=s.seen||[]; state.cfg=Object.assign({weekGoal:7},s.cfg||{}); state.focus=s.focus||null; state.lastSeen=s.lastSeen||null; state.bonusPts=s.bonusPts||0; state.play=Object.assign({lastSpin:null,freezes:0,chests:0,loginDay:0,loginDate:null,lastScratch:null,lastDice:null,diceChallenge:null,doubleNext:false}, s.play||{});}
  }catch(e){}
  try{ migrate(); }catch(e){ console.error('migrate',e); }
  if(!state.skills.length) state.skills=seedSkills();
  try{ sessionAway = daysAway(); }catch(e){ sessionAway=0; }
  try{ checkLogin(); }catch(e){ console.error('login',e); }
  if(state.lastSeen!==todayStr()){ state.lastSeen=todayStr(); save(); }
  try{ render(); }catch(e){ console.error('render',e); }
  try{ checkBadges(true); }catch(e){ console.error('badges',e); }
}
let sessionAway=0;

// repair data saved by earlier versions
function migrate(){
  if(!state.skills.length) return;
  const totalRepsLogged=state.skills.reduce((a,s)=>a+((s.reps&&s.reps.length)||0),0);
  const oldSeed=new Set(['lip combos','twerk','public speaking','colour grading','cinematography','sony a7iii','fashion styling','interior design']);
  const looksOldDefault = state.skills.every(s=>oldSeed.has((s.name||'').toLowerCase()));
  // if it's the untouched old default set (no real reps), just replace with the new categorized seed
  if(looksOldDefault && totalRepsLogged===0){ state.skills=seedSkills(); save(); return; }
  // otherwise, gently repair: give every skill a valid category, make everything active
  const validCats=CATS.map(c=>c[0]);
  const seedMap={}; seedSkills().forEach(sk=>{ seedMap[sk.name.toLowerCase()]=sk.cat; });
  // old names -> correct category, so legacy data never lands in the wrong place
  const legacyCat={'lip combos':'beauty','colour grading':'beauty','colour matching':'beauty',
    'fashion styling':'beauty','sony a7iii':'visual','interior design':'space','twerk':'movement',
    'public speaking':'voice','cinematography':'visual'};
  let changed=false;
  state.skills.forEach(sk=>{
    if(!sk.cat || !validCats.includes(sk.cat)){ const nm=(sk.name||'').toLowerCase(); sk.cat=seedMap[nm]||legacyCat[nm]||'business'; changed=true; }
    if(sk.status!=='active'){ sk.status='active'; changed=true; }
    if(!Array.isArray(sk.reps)){ sk.reps=[]; changed=true; }
    if(!sk.goal){ sk.goal=DEFAULT_GOAL; changed=true; }
  });
  if(changed) save();
}
async function save(){ await store.set(KEY,JSON.stringify(state)); }

/* ================= badges ================= */
const B=(n,d,t,f)=>({n,d,t,f});
const BADGES=[
  B('First take','Log your first take in any skill',1,()=>({have:totalReps()>0?1:0,need:1})),
  B('Ten deep','10 total takes',1,()=>({have:totalReps(),need:10})),
  B('Half a hundred','50 total takes',2,()=>({have:totalReps(),need:50})),
  B('The hundred','100 total takes',2,()=>({have:totalReps(),need:100})),
  B('Five hundred','500 total takes',3,()=>({have:totalReps(),need:500})),
  B('Thousand','1,000 total takes',3,()=>({have:totalReps(),need:1000})),

  B('Off the mark','Reach take 10 in a skill',1,()=>({have:Math.max(0,...state.skills.map(repCount)),need:10})),
  B('Finding it','Reach take 30 in a skill',1,()=>({have:Math.max(0,...state.skills.map(repCount)),need:30})),
  B('Getting good','Reach take 60 in a skill',2,()=>({have:Math.max(0,...state.skills.map(repCount)),need:60})),
  B('Sharp','Reach take 90 in a skill',2,()=>({have:Math.max(0,...state.skills.map(repCount)),need:90})),
  B('Mastered one','Take a skill to 100',3,()=>({have:masteredCount(),need:1})),
  B('Mastered three','Master three skills',3,()=>({have:masteredCount(),need:3})),

  B('Three on the go','3 skills active at once',1,()=>({have:activeSkills().length,need:3})),
  B('Wide net','5 skills with takes logged',2,()=>({have:state.skills.filter(s=>repCount(s)>0).length,need:5})),
  B('Rated highly','A take you scored 5/5',1,()=>({have:state.skills.some(s=>s.reps.some(r=>r.rating===5))?1:0,need:1})),
  B('Climbing','Average 4+ over a skill last 10 takes',2,()=>{
    const best=Math.max(0,...state.skills.map(s=>{const l=s.reps.slice(-10).filter(r=>r.rating);return l.length>=10?l.reduce((a,r)=>a+r.rating,0)/l.length:0;}));
    return {have:best>=4?1:0,need:1};}),
  B('Seven day run','Log a take 7 days in a row',2,()=>({have:streak(),need:7})),
  B('Thirty day run','Log a take 30 days in a row',3,()=>({have:streak(),need:30})),
  B('Every skill going','Log a take in every skill you have',2,()=>({have:state.skills.length&&state.skills.every(s=>repCount(s)>0)?1:0,need:1})),
  B('Level ten','Reach overall level 10',3,()=>({have:overallLevel().lv,need:10})),

  // ---- category ----
  B('Renaissance','Log a take in all 7 categories',3,()=>({have:CATS.filter(([id])=>catReps(id)>0).length,need:7})),
  B('Category climber','Take any category to level 3',2,()=>({have:Math.max(1,...CATS.map(([id])=>catLevel(id).lv)),need:3})),
  B('Area master','Master every skill in a category',3,()=>{
    const done=CATS.some(([id])=>{const l=catSkills(id);return l.length&&l.every(s=>repCount(s)>=goalOf(s));});
    return {have:done?1:0,need:1};}),

  // ---- rating / quality ----
  B('Five stars','Log five 5-rated takes',2,()=>({have:state.skills.reduce((a,s)=>a+s.reps.filter(r=>r.rating===5).length,0),need:5})),
  B('Consistent quality','A skill averaging 4+ over 20 takes',3,()=>{
    const best=Math.max(0,...state.skills.map(s=>{const r=s.reps.filter(x=>x.rating);return r.length>=20?r.reduce((a,x)=>a+x.rating,0)/r.length:0;}));
    return {have:best>=4?1:0,need:1};}),

// ================= THE STORY =================
// reconstruct the journey as dated milestones from every take's timestamp
function buildStory(){
  const events=[];
  state.skills.forEach(sk=>{
    const goal=goalOf(sk);
    const reps=[...sk.reps].sort((a,b)=>a.at-b.at);
    let bestSoFar=0;
    reps.forEach((r,i)=>{
      const n=i+1;
      // first ever take in this skill
      if(n===1) events.push({at:r.at, kind:'first', skill:sk.name, text:'Started '+sk.name, sub:'The first take. The hardest one.'});
      // stage crossings
      const before=stageOfN(n-1,goal).idx, after=stageOfN(n,goal).idx;
      if(after>before && after>0 && n<goal) events.push({at:r.at, kind:'stage', skill:sk.name, text:sk.name+' reached '+STAGES[after].name, sub:'Take '+n+'. A new level.'});
      // mastery
      if(n>=goal) events.push({at:r.at, kind:'mastery', skill:sk.name, text:'Mastered '+sk.name+' \u2b50', sub:goal+' takes. It is yours forever.'});
      // personal best rating (once it climbs past 3 prior)
      if(r.rating && i>=3 && r.rating>bestSoFar && r.rating>=4) events.push({at:r.at, kind:'best', skill:sk.name, text:'Best '+sk.name+' yet', sub:'Rated '+r.rating+'/5. You are getting good.'});
      if(r.rating>bestSoFar) bestSoFar=r.rating;
    });
  });
  // overall total-take milestones
  const allByTime=state.skills.flatMap(s=>s.reps.map(r=>({at:r.at}))).sort((a,b)=>a.at-b.at);
  [10,50,100,250,500,1000].forEach(m=>{ if(allByTime.length>=m) events.push({at:allByTime[m-1].at, kind:'total', text:m+' takes total', sub:'Across every skill. Relentless.'}); });
  events.sort((a,b)=>b.at-a.at);  // newest first
  return events;
}
function storyIcon(kind){
  return kind==='mastery'?'\u2b50':kind==='stage'?'\u25b2':kind==='first'?'\u25cf':kind==='best'?'\u2605':kind==='total'?'\u26a1':'\u25cf';
}
function storyCard(){
  const ev=buildStory();
  if(!ev.length) return `<div class="card"><div class="cap">Your story</div>
    <p class="lede" style="margin:0">Log your first take and your story begins here, every milestone, in order.</p></div>`;
  const show=ev.slice(0,14);

function beforeAfterCard(){
  const mastered=state.skills.filter(s=>repCount(s)>=goalOf(s) && s.reps.filter(r=>r.rating).length>=4);
  if(!mastered.length) return '';
  return mastered.map(sk=>{
    const rated=sk.reps.filter(r=>r.rating);
    const firstFew=rated.slice(0,3), lastFew=rated.slice(-3);
    const avg=a=>a.reduce((x,r)=>x+r.rating,0)/a.length;
    const before=avg(firstFew), after=avg(lastFew);
    const firstNote=(sk.reps.find(r=>r.note)||{}).note||'';
    const lastNote=([...sk.reps].reverse().find(r=>r.note)||{}).note||'';
    return `<div class="card">

        <div class="baarrow">\u2192</div>

      </div>
      ${after>before?`<div class="note" style="margin-top:12px">You improved by ${((after-before)).toFixed(1)} points from your first takes to your last. Proof it worked.</div>`:''}
    </div>`;
  }).join('');
}

function wheelSVG(){
  const n=SPIN_PRIZES.length, cx=100, cy=100, r=94;
  const cols=['#2563EB','#0B2A4A','#3E6BB8','#1B4E86','#2563EB','#0B2A4A','#3E6BB8','#1B4E86'];
  let out='';
  for(let i=0;i<n;i++){
    const a0=(i/n)*2*Math.PI - Math.PI/2, a1=((i+1)/n)*2*Math.PI - Math.PI/2;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    out+=`<path d="M${cx} ${cy} L${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" fill="${cols[i%cols.length]}" stroke="#fff" stroke-width="1"/>`;
    // label
    const am=(a0+a1)/2, lr=r*0.62;
    const lx=cx+lr*Math.cos(am), ly=cy+lr*Math.sin(am);
    const short=SPIN_PRIZES[i].kind==='pts'?('+'+SPIN_PRIZES[i].val):SPIN_PRIZES[i].kind==='freeze'?'\u2744':SPIN_PRIZES[i].kind==='chest'?'\u{1F381}':'x2';
    out+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" fill="#fff" font-size="11" font-weight="800" text-anchor="middle" dominant-baseline="middle" transform="rotate(${(am*180/Math.PI+90).toFixed(0)} ${lx.toFixed(1)} ${ly.toFixed(1)})">${short}</text>`;
  }
  out+=`<circle cx="100" cy="100" r="16" fill="#fff"/><circle cx="100" cy="100" r="16" fill="none" stroke="var(--go)" stroke-width="2"/>`;
  return out;
}

async function doSpin(){
  if(!canSpin()) return;
  const prize=pickPrize();
  const idx=SPIN_PRIZES.indexOf(prize);
  const n=SPIN_PRIZES.length;
  // rotate so the chosen wedge lands under the top pin (pin at -90deg / top)
  const perSlice=360/n;
  const target=360*6 - (idx*perSlice + perSlice/2);   // several full turns + land on wedge center
  const wheel=document.getElementById('wheel');
  const btn=document.getElementById('spinBtn');
  if(btn){ btn.disabled=true; btn.textContent='Spinning\u2026'; }
  if(wheel){ wheel.style.transition='transform 3.2s cubic-bezier(.15,.9,.2,1)'; wheel.style.transform=`rotate(${target}deg)`; }
  state.play.lastSpin=todayStr();
  setTimeout(async()=>{
    await applyPrize(prize);
    await save(); render();
    toast('You won: '+prize.label, spinFlavor(prize));
    confetti(prize.val>=100 || prize.kind!=='pts');
  }, 3300);
}
function spinFlavor(p){
  if(p.kind==='pts') return 'Points added to your total.';
  if(p.kind==='freeze') return 'Banked. Spend it to save a broken streak.';
  if(p.kind==='chest') return 'A mystery chest is waiting to be opened.';
  if(p.kind==='double') return 'Your next take is worth double points.';
  return '';
}
async function applyPrize(p){
  if(p.kind==='pts') state.bonusPts=(state.bonusPts||0)+p.val;
  else if(p.kind==='freeze') state.play.freezes+=1;
  else if(p.kind==='chest') state.play.chests+=1;
  else if(p.kind==='double') state.play.doubleNext=true;
}

const LOGIN_LADDER=[10,15,20,30,40,60,100];  // points, day 7 biggest
function checkLogin(){
  const t=todayStr();
  if(state.play.loginDate===t) return;         // already counted today
  const y=iso(new Date(Date.now()-86400000));
  if(state.play.loginDate===y) state.play.loginDay=(state.play.loginDay||0)+1; // consecutive
  else state.play.loginDay=1;                    // reset
  if(state.play.loginDay>7) state.play.loginDay=1;
  state.play.loginDate=t;
  const reward=LOGIN_LADDER[state.play.loginDay-1];
  state.bonusPts=(state.bonusPts||0)+reward;
  loginRewardToday=reward;
  save();
}

  const sp=s.sprint;
  const r=repCount(s);
  if(sp && sp.week===iso(weekStart()) && sp.target>r){
    const start=sp.start||0, gained=r-start, need=sp.target-start;
    const pct=Math.min(100,gained/need*100);
    return `<div class="card" style="box-shadow:none;border-color:var(--go)">

        <span style="font-size:13px;font-weight:800;color:var(--go)">${r}/${sp.target}</span></div>

      <div class="ghostrow"><button class="ghost" data-clearsprint="${s.id}">Cancel sprint</button></div>

  }
  if(sp && sp.target<=r && sp.week===iso(weekStart())){

function ratingTrend(s){
  const rated=s.reps.filter(r=>r.rating);
  if(rated.length<2) return '<p class="lede" style="margin:0">Log a few rated takes and your improvement line appears here.</p>';
  const W=280,H=70,pad=6;
  const pts=rated.map((r,i)=>{
    const x=pad+(i/(rated.length-1))*(W-pad*2);
    const y=H-pad-((r.rating-1)/4)*(H-pad*2);
    return [x,y];
  });
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="var(--go)"/>`).join('');
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%">
    <path d="${path}" fill="none" stroke="var(--go)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}</svg>`;
}

/* ================= actions ================= */
async function logRep(id){
  const s=skillById(id); if(!s||repCount(s)>=goalOf(s)) return;
  const goal=goalOf(s);
  const beforeReps=repCount(s);
  const before=stageOfN(beforeReps,goal).idx;
  const n=beforeReps+1;
  const rating=draft.rating||0;
  // context for small-win detection (before pushing)
  const priorRated=s.reps.filter(r=>r.rating);
  const priorAvg=priorRated.length?priorRated.reduce((a,r)=>a+r.rating,0)/priorRated.length:0;
  const priorBest=Math.max(0,...priorRated.map(r=>r.rating));
  const firstToday = !anyRepToday();
  const firstEverInSkill = beforeReps===0;

  let gained=takePointsFor(s,n);
  // comeback bonus: first take after a 3+ day gap is worth double
  const backBonus = sessionAway>=3;
  if(backBonus) gained*=2;
  // spin reward: double the next take
  const dbl = state.play&&state.play.doubleNext;
  if(dbl){ gained*=2; state.play.doubleNext=false; }
  // surprise: ~1 in 12 takes is a lucky take (bonus points), except when a bigger win is already happening
  const lucky = !backBonus && Math.random()<0.085;
  if(lucky) gained+=25;
  const baseTake=takePointsFor(s,n);
  if(gained>baseTake) state.bonusPts=(state.bonusPts||0)+(gained-baseTake);
  // dice challenge: award once when its condition is first met
  const dc=state.play&&state.play.diceChallenge;
  if(dc && !dc.claimed && DICE_CHALLENGES[dc.idx] && DICE_CHALLENGES[dc.idx].check()){
    dc.claimed=true; state.bonusPts=(state.bonusPts||0)+dc.pts; setTimeout(()=>toast('Dice challenge done!','+'+dc.pts+' points. '+dc.text),900);
  }
  s.reps.push({n, rating, note:(draft.note||'').trim(), at:Date.now(), day:todayStr()});
  state.lastSeen=todayStr();
  const after=stageOfN(n,goal).idx;
  draft={rating:0,note:''};
  await save();

  // ---- layered celebration: pick the biggest win to headline, confetti scales with it ----
  let big=false;
  if(n>=goal){ toast(s.name+' mastered! \u2b50', goal+' takes. The skill is yours forever.'); big=true; }
  else if(firstEverInSkill){ toast('First take, '+s.name+'!','The hardest one is done. '+(goal-1)+' to go.'); big=true; }
  else if(after>before){ toast('New stage, '+STAGES[after].name+'!', s.name+' \u00b7 take '+n+'. You levelled up.'); big=true; }
  else if([Math.round(goal*.25),Math.round(goal*.5),Math.round(goal*.75)].includes(n)){ toast('Take '+n+' \u00b7 '+s.name, n===Math.round(goal*.5)?'Halfway to mastery. Huge.':'Milestone take. Keep stacking.'); big=true; }
  else if(rating>=5){ toast('A perfect 5 \u2b50','Take '+n+' of '+s.name+'. That\u2019s the standard now.'); }
  else if(rating && priorRated.length>=3 && rating>priorBest){ toast('Personal best!','Take '+n+' was your best '+s.name+' yet ('+rating+'/5).'); }
  else if(rating && priorRated.length>=3 && rating>priorAvg+0.5){ toast('You\u2019re improving','Take '+n+' beat your '+s.name+' average. It\u2019s working.'); }
  else if(firstToday){ toast('First take of the day','Take '+n+' of '+s.name+'. Momentum starts now.'); }
  else if(backBonus){ toast('Welcome back \u2014 double points!','Take '+n+' of '+s.name+'. +'+gained+' for showing up.'); big=true; }
  else if(lucky){ toast('Lucky take! \u2728','A surprise +25 on take '+n+' of '+s.name+'.'); big=true; }
  else { toast('Take '+n+' logged','\u2191 '+s.name+' \u00b7 '+(goal-n)+' to mastery.'); }

  pointsPop(gained);
  confetti(big);
  render(); renderSheet(); checkBadges();
}
function countUpPoints(){
  const el=document.getElementById('ptsNum'); if(!el) return;
  const target=totalPoints(); const dur=700; const t0=performance.now();
  function step(t){ const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    el.textContent=Math.round(target*e).toLocaleString(); if(k<1) requestAnimationFrame(step); }
  requestAnimationFrame(step);
}
// a floating "+N" that rises and fades on every take
function pointsPop(n){
  const el=document.createElement('div'); el.className='ptspop'; el.textContent='+'+n;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1300);
}
const anyRepToday=()=>state.skills.some(s=>s.reps.some(r=>r.day===todayStr()));

async function saveEditTake(){

async function deleteTake(){

  s.reps=s.reps.filter(r=>r.n!==editN);

  await save(); editN=null; render(); renderSheet(); checkBadges(true); toast('Take deleted','You are back to '+repCount(s)+'.');

function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function makeShareCard(){

    setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Card saved','High-res image in your downloads.');},'image/png');

  x.fillStyle='rgba(184,137,43,.16)'; x.beginPath(); x.arc(W-70,150,240,0,7); x.fill();

  x.textAlign='left';
  x.fillStyle=GOLD; x.font=F(900,30); x.letterSpacing='8px'; x.fillText('MASTERED \u2605', 72, 130); x.letterSpacing='0px';
  // skill name, wrapped if long
  x.fillStyle='#FFFFFF'; x.font=RF(74);
  const words=sk.name.split(' '); let line='',yy=230;
  words.forEach(w=>{ const t=(line?line+' ':'')+w; if(x.measureText(t).width>W-150&&line){ x.fillText(line,70,yy); yy+=80; line=w; } else line=t; });
  x.fillText(line,70,yy);
  x.fillStyle='#9EC1FF'; x.font=F(800,32); x.fillText(catName(sk.cat), 74, yy+52);

  x.fillStyle='#FFFFFF'; x.font=RF(184); x.fillText('100', 64, 540);
  x.fillStyle=GOLD; x.font=F(900,38); x.letterSpacing='3px'; x.fillText('TAKES COMPLETE', 76, 588); x.letterSpacing='0px';

  const stats=[[days,'days of work'],[avg?avg.toFixed(1)+'/5':'\u2013','average rating'],[best||'\u2013','best take'],['\u2605\u2605\u2605\u2605\u2605','the standard']];
  const gx=64,gap=26,gw=(W-gx*2-gap)/2,gh=150,gyTop=GT+56;
  stats.forEach((st,i)=>{const col=i%2,row=Math.floor(i/2);const bx=gx+col*(gw+gap),by=gyTop+row*(gh+gap);
    x.fillStyle='#F4F7FC'; roundRect(x,bx,by,gw,gh,24); x.fill(); x.strokeStyle=LINE; x.lineWidth=2; roundRect(x,bx,by,gw,gh,24); x.stroke();
    const isStars=String(st[0]).includes('\u2605');
    x.fillStyle=isStars?GOLD:INK; x.font=RF(isStars?40:56); x.fillText(String(st[0]), bx+28, by+ (isStars?76:80));
    x.fillStyle=MUT; x.font=F(900,24); x.letterSpacing='1.2px'; x.fillText(String(st[1]).toUpperCase(), bx+30, by+120); x.letterSpacing='0px';});

  const dateY=H-84,subY=H-52,ruleY=H-132;
  x.strokeStyle=LINE; x.lineWidth=1.5; x.beginPath(); x.moveTo(72,ruleY); x.lineTo(W-72,ruleY); x.stroke();
  x.textAlign='left'; x.fillStyle=INK; x.font=F(800,27); x.fillText(longToday(), 72, dateY);
  x.fillStyle=MUT; x.font=F(700,22); x.fillText('Fatu\u2019s 100 \u00b7 a skill mastered', 72, subY);
  x.textAlign='right'; x.fillStyle=GOLD; x.font=F(800,24); x.fillText('Unstoppable', W-72, (dateY+subY)/2+2); x.textAlign='left';

  c.toBlob(blob=>{const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download='fatu-mastered-'+sk.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.png';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast('Mastery card saved','A keepsake for '+sk.name+'.');},'image/png');
}

document.getElementById('scrim').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
document.querySelectorAll('.nb').forEach(b=>b.onclick=()=>{page=b.dataset.go;openCat=null;window.scrollTo({top:0,behavior:'smooth'});render();});
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
load();
</script>
